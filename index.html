<style>

<script>
// ═══════════════════════════════════════════════════════════════════
// CONFIGURACIÓN: Pega aquí la URL de tu Google Apps Script
// ═══════════════════════════════════════════════════════════════════
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzoH-RmuhRS-jz9UuVESHS2jCsUrAHV7j0LawntbK_Y3vO3Usbn3TK3YaK7Yk411fqOIg/exec';
// ═══════════════════════════════════════════════════════════════════

function showScreen(id){
  document.getElementById('login-screen').style.display   = id==='login'   ? 'flex'  : 'none';
  document.getElementById('loading-screen').style.display = id==='loading' ? 'flex'  : 'none';
  document.getElementById('error-screen').style.display   = id==='error'   ? 'flex'  : 'none';
  document.getElementById('dashboard').style.display      = id==='dash'    ? 'flex'  : 'none';
}
function goLogin(){
  _code=''; Object.keys(_cache).forEach(k=>delete _cache[k]); _loaded.clear();
  showScreen('login'); document.getElementById('ci').value='';
}

// ── CSV ENGINE ────────────────────────────────────────────────────

function csvRow(line){
  const cols=[];let cur='',inQ=false;
  for(let i=0;i<line.length;i++){
    const ch=line[i];
    if(ch==='"'){inQ=!inQ;continue;}
    if(ch===','&&!inQ){cols.push(cur.trim());cur='';}
    else cur+=ch;
  }
  cols.push(cur.trim());
  return cols;
}

function parseFile(raw){
  const lines=(raw||'').split(/\r?\n/).map(s=>s.trim()).filter(Boolean);
  let hi=lines.findIndex(l=>/consultora/i.test(l)&&l.includes(','));
  if(hi<0) return {headers:[],rows:[],idx:{}};
  const headers=csvRow(lines[hi]);
  const idx={};
  headers.forEach((h,i)=>{const k=h.trim();if(!idx[k])idx[k]=[];idx[k].push(i);});
  const rows=[];
  for(let i=hi+1;i<lines.length;i++){
    const l=lines[i];
    if(!l||/^total/i.test(l)) continue;
    const cols=csvRow(l);
    if(cols.length<4) continue;
    const row={};
    headers.forEach((h,j)=>{row[h.trim()]=(cols[j]||'').trim();});
    row._raw=cols; row._idx=idx;
    rows.push(row);
  }
  return {headers,rows,idx};
}

function findDir(rows,code){
  if(!rows||!rows.length||!code) return null;
  const c=code.toUpperCase().trim();
  return rows.find(r=>{
    const v=(r['Número de Consultora']||r['Consultora']||'').toUpperCase().trim();
    if(v===c) return true;
    return (r._raw||[]).some(cell=>(cell||'').toUpperCase().trim()===c);
  })||null;
}

function cv(raw,idx,name,occ=0){
  const positions=(idx[name]||idx[name.trim()]||[]);
  const pos=positions[occ];
  return pos!=null?(raw[pos]||''):'';
}

function money(v){
  if(!v&&v!==0) return 0;
  const n=parseFloat(String(v).replace(/[$,\s]/g,'').replace('(','-').replace(')',''));
  return isNaN(n)?0:n;
}
function fmt(n){return '$'+Math.round(Math.abs(n||0)).toLocaleString('es-MX');}
function num(v){return parseInt(v||0)||0;}
function pct(v,g){return!g?0:Math.min(100,Math.max(0,Math.round(v/g*100)));}

// ── FETCH CSV VÍA APPS SCRIPT ────────────────────────────────────
const _cache={};
async function getFile(key){
  if(_cache[key]) return _cache[key];
  if(!APPS_SCRIPT_URL||APPS_SCRIPT_URL.startsWith('PENDIENTE'))
    return {headers:[],rows:[],idx:{}};
  try{
    const url=APPS_SCRIPT_URL+'?file='+key+'&t='+Date.now();
    const res=await fetch(url,{redirect:'follow'});
    if(!res.ok) throw new Error('HTTP '+res.status);
    const txt=await res.text();
    if(txt.startsWith('ERROR:')) throw new Error(txt);
    _cache[key]=parseFile(txt);
    return _cache[key];
  }catch(e){
    console.error('Error cargando',key,e);
    return {headers:[],rows:[],idx:{}};
  }
}

// ── UI PRIMITIVES ─────────────────────────────────────────────────
function bdg(t,c){return`<span class="bdg ${c}">${t}</span>`;}
function sBdg(p){return p>=100?bdg('✅ Meta lograda','bok'):p>=65?bdg('📈 En progreso','bwn'):bdg('⚡ Necesita avanzar','ber');}

function pCard(label,val,goal,fmtFn,cls=''){
  fmtFn=fmtFn||fmt;
  const p=pct(val,goal),falt=Math.max(0,goal-val);
  return`<div class="card ${cls}">
    <div class="cl">${label}</div>
    <div class="cv">${fmtFn(val)}</div>
    <div class="cm">Meta: ${fmtFn(goal)}</div>
    ${sBdg(p)}
    <div class="pw">
      <div class="pl"><span>${p}%</span><span>Falta: ${fmtFn(falt)}</span></div>
      <div class="pb"><div class="pf ${cls}" style="width:${p}%"></div></div>
    </div></div>`;
}

function iCard(label,val,meta='',btxt='',bcls='binfo'){
  const fs=String(val).length>13?'14px':'21px';
  return`<div class="card">
    <div class="cl">${label}</div>
    <div class="cv" style="font-size:${fs}">${val||'—'}</div>
    ${meta?`<div class="cm">${meta}</div>`:''}
    ${btxt?bdg(btxt,bcls):''}
  </div>`;
}

function errBlk(pilar){
  return`<div class="terr"><p>Sin datos de <strong>${pilar}</strong> para este código.</p>
  <p style="margin-top:8px;font-size:11px">Verifica que la URL de Google Sheets esté configurada y el archivo tenga tu código.</p></div>`;
}

// ── TAB 0: COMISIONES ─────────────────────────────────────────────
async function renderCom(code){
  const [cData,eData]=await Promise.all([getFile('com'),getFile('est')]);
  const d=findDir(cData.rows,code);
  if(!d) return errBlk('Comisiones Directoras');
  const e=findDir(eData.rows,code);
  const r=d._raw||[], ix=d._idx||cData.idx;
  const er=e?._raw||[], eix=e?._idx||eData.idx;

  const mayoreoUnidad  = money(cv(r,ix,'Mayoreo',0));
  const prodYTD        = money(cv(r,ix,'Producción de unidad al menudeo de año Seminario'));
  const activosUnidad  = num(cv(r,ix,'Consultores Activos',0));
  const activosPersonal= num(cv(r,ix,'Consultores Activos',1));
  const mayoreoPersonal= money(cv(r,ix,'Mayoreo',1));
  const mayoreoEquipo  = money(cv(r,ix,'Mayoreo',2));
  const nuevasMes      = num(cv(r,ix,'Nuevas Integrantes',0));
  const califUnidad    = num(cv(r,ix,'Calificadas de Comienzo Grandioso mensuales',0));
  const califEquipo    = num(cv(r,ix,'Calificadas de Comienzo Grandioso mensuales',1));
  const offsprings     = num(cv(r,ix,'Número de Offsprings'));

  // Bono CG Unidad
  let bonoUnidad=0,bonoUnidadTxt='',bonoUnidadCls='ber';
  if(califUnidad>=4){
    bonoUnidad=Math.min(1000,400+Math.max(0,califUnidad-4)*100);
    bonoUnidadTxt=bonoUnidad>=1000?'🏆 Máximo $1,000':'🎉 Bono ganado: $'+bonoUnidad;
    bonoUnidadCls='bok';
  }else{
    const f=4-califUnidad;
    bonoUnidadTxt='Faltan '+f+' calificada'+(f>1?'s':'')+' para el bono $400';
    bonoUnidadCls=califUnidad>0?'bwn':'ber';
  }
  const bonoEquipo=califEquipo*100;

  // Estrellas col J
  const starsTot=num(cv(er,eix,'# de Estrellas de Unidad',0));
  const nivelEst=cv(er,eix,'Nivel de Estrella personal',0)||'—';

  // Comisión unidad
  let uPct,uCls,uTxt;
  if(mayoreoUnidad>=5500){uPct=23;uCls='ok';uTxt='✅ 23% – Máxima comisión';}
  else if(mayoreoUnidad>=4500){uPct=13;uCls='wn';uTxt='📈 13% – Falta '+fmt(5500-mayoreoUnidad)+' para el 23%';}
  else{uPct=9;uCls='er';uTxt='⚡ 9% – Falta '+fmt(4500-mayoreoUnidad)+' para el 13%';}
  const uComision=Math.round(mayoreoUnidad*uPct/100);
  const t1=Math.round(4500/5500*100);

  // Comisión equipo
  let ePct,eCls,eTxt;
  const tieneA1y600=activosPersonal>=5&&mayoreoPersonal>=600;
  if(tieneA1y600){ePct=13;eCls='ok';eTxt='✅ 13% – Equipo calificado A1';}
  else if(activosPersonal>=5){ePct=9;eCls='wn';eTxt='📈 9% – Pedido propio <$600 (falta para 13%)';}
  else if(activosPersonal>=1){ePct=4;eCls='er';eTxt='⚡ 4% – Necesitas '+(5-activosPersonal)+' más activas para el 9%';}
  else{ePct=0;eCls='er';eTxt='Sin integrantes activas este mes';}
  const eComision=Math.round(mayoreoEquipo*ePct/100);
  const totalCom=uComision+eComision;

  const uBar=Math.min(100,Math.round(mayoreoUnidad/5500*100));
  const eBar=Math.min(100,Math.round(activosPersonal/5*100));

  return`
    <h2 class="stitle">💰 Comisión de Unidad</h2>
    <div class="ibox">
      &nbsp;• <strong>9%</strong> → $0 – $4,499 &nbsp;• <strong>13%</strong> → $4,500 – $5,499 &nbsp;• <strong>23%</strong> → $5,500 o más
    </div>
    <div class="grid">
      <div class="card ${uCls}">
        <div class="cl">Mayoreo de unidad (col N)</div>
        <div class="cv">${fmt(mayoreoUnidad)}</div>
        <div class="cm">Comisión: <strong>${uPct}%</strong> = estimado <strong>${fmt(uComision)}</strong></div>
        ${bdg(uTxt,uPct===23?'bok':uPct===13?'bwn':'ber')}
        <div class="pw" style="margin-top:8px">
          <div class="pl"><span>$0</span><span style="margin-left:auto">$4,500</span><span style="margin-left:auto">$5,500</span></div>
          <div class="pb" style="position:relative;background:#f0e0eb;height:10px">
            <div style="position:absolute;left:0;width:${t1}%;height:100%;background:#fde8ef;border-right:2px dashed #e9b4c8"></div>
            <div style="position:absolute;left:${t1}%;width:${100-t1}%;height:100%;background:#fef3e2;border-right:2px dashed #e9d07a"></div>
            <div class="pf ${uCls}" style="position:relative;width:${uBar}%;height:100%;z-index:1"></div>
          </div>
          <div class="pl" style="margin-top:3px"><span>9%</span><span style="margin-left:auto">13%</span><span style="margin-left:auto">23%</span></div>
        </div>
      </div>
      ${iCard('Producción unidad YTD',fmt(prodYTD),'Acumulado año seminario')}
      ${iCard('Consultoras activas',activosUnidad,'En tu unidad',
        activosUnidad>=15?'Excelente':activosUnidad>=8?'Buen ritmo':'Seguir creciendo',
        activosUnidad>=15?'bok':activosUnidad>=8?'bwn':'ber')}
    </div>

    <h2 class="stitle">🤝 Comisión por Equipo Personal</h2>
    <div class="ibox">
      &nbsp;• <strong>4%</strong> → 1–4 activas &nbsp;• <strong>9%</strong> → 5+ activas &nbsp;• <strong>13%</strong> → 5+ activas A1 + pedido propio ≥$600
    </div>
    <div class="grid">
      <div class="card ${eCls}">
        <div class="cl">Mayoreo equipo personal</div>
        <div class="cv">${fmt(mayoreoEquipo)}</div>
        <div class="cm">Comisión: <strong>${ePct}%</strong> = estimado <strong>${fmt(eComision)}</strong></div>
        ${bdg(eTxt,ePct===13?'bok':ePct===9?'bwn':'ber')}
        <div class="pw" style="margin-top:8px">
          <div class="pl"><span>Activas: <strong>${activosPersonal}</strong></span><span style="margin-left:auto">Meta: 5</span></div>
          <div class="pb"><div class="pf ${eCls}" style="width:${eBar}%"></div></div>
        </div>
        ${ePct===9?`<div class="cm" style="margin-top:6px">Pedido propio: ${fmt(mayoreoPersonal)} ${mayoreoPersonal>=600?'✅':'→ falta $'+fmt(600-mayoreoPersonal)+' para 13%'}</div>`:''}
      </div>
      ${iCard('Integrantes activas',activosPersonal,'Tu equipo personal',
        activosPersonal>=5?'5+ activas ✓':'Faltan '+(5-activosPersonal)+' para 9%',
        activosPersonal>=5?'bok':'bwn')}
      <div class="card go">
        <div class="cl">Estimado total comisiones</div>
        <div class="cv">${fmt(totalCom)}</div>
        <div class="cm">${fmt(uComision)} unidad + ${fmt(eComision)} equipo</div>
        ${bdg('Estimado sin deducciones MK','binfo')}
      </div>
    </div>

    <h2 class="stitle">🎁 Bono CG – Unidad (col W)</h2>
    <div class="ibox">
      4 calificadas CG de unidad → <strong>$400</strong>; cada adicional → <strong>+$100</strong>; máximo <strong>$1,000</strong>/mes.
    </div>
    <div class="grid">
      <div class="card ${bonoUnidad>0?'ok':''}">
        <div class="cl">Calificadas CG Unidad (col W)</div>
        <div class="cv">${califUnidad}</div>
        <div class="cm">Mínimo 4 para activar bono</div>
        ${bdg(bonoUnidadTxt,bonoUnidadCls)}
        <div class="pw">
          <div class="pl"><span>${califUnidad} de 4 mínimo</span><span style="margin-left:auto">Máx: 10</span></div>
          <div class="pb"><div class="pf ${bonoUnidad>0?'ok':''}" style="width:${Math.min(100,Math.round(califUnidad/10*100))}%"></div></div>
        </div>
      </div>
      <div class="card go">
        <div class="cl">Bono Unidad estimado</div>
        <div class="cv">${bonoUnidad>0?'$'+bonoUnidad:'$0'}</div>
        <div class="cm">${califUnidad>=4?califUnidad+' calificadas → $400'+(califUnidad>4?' + $'+((califUnidad-4)*100)+' adicional':''):'Necesitas '+(4-califUnidad)+' más'}</div>
        ${bonoUnidad>=1000?bdg('🏆 Máximo','bok'):bonoUnidad>0?bdg('✅ Bono activo','bok'):bdg('Sin bono aún','ber')}
      </div>
      ${iCard('Nuevas integrantes (mes)',nuevasMes,'Incorporaciones este mes',

// ── TAB 1: PROGRAMA PRIMER AÑO ────────────────────────────────────
async function renderPA(code){
  const [d1,d2,d3,d4]=await Promise.all([getFile('cf1'),getFile('cf2'),getFile('cf3'),getFile('cf4')]);
  function retoCard(label,data){
    const d=findDir(data.rows,code);
    if(!d) return`<div class="card" style="opacity:.4;border-left-color:#ccc">
      <div class="cl">${label}</div>
      <div class="cv" style="font-size:14px;color:var(--gy)">No inscrita</div>
      <div class="cm">No aplica en este período</div>
      ${bdg('Sin período activo','binfo')}</div>`;
    const r=d._raw||[], ix=d._idx||data.idx;
    const tot =money(cv(r,ix,'Total',0));
    const met =money(cv(r,ix,'Meta',0))||15000;
    const nec =money(cv(r,ix,'Necesario',0));
    const cTot=num(cv(r,ix,'Cantidad total',0))||num(r[15]);
    const cMet=num(cv(r,ix,'Meta',1))||6;
    const cNec=num(cv(r,ix,'Necesario',1));
    const plazo=cv(r,ix,'Plazo del concurso')||r[9]||'—';
    const win=(r.slice(18)||[]).some(v=>/^(yes|si|sí|1)$/i.test((v||'').trim()));
    const p1=pct(tot,met),p2=pct(cTot,cMet);
    const cls=win||(p1>=100&&p2>=100)?'ok':'';
    const b=win?bdg('🏆 Ganadora – $1,000','bok'):(p1>=100&&p2>=100)?bdg('✅ Meta lograda – $1,000','bok'):(p1>=65||p2>=65)?bdg('📈 En progreso','bwn'):bdg('⚡ Necesita avanzar','ber');
    return`<div class="card ${cls}">
      <div class="cl">${label}</div>
      <div class="g2">
        <div class="ms"><label>Producción</label>
          <div class="v">${fmt(tot)}</div><div class="m">Meta: ${fmt(met)}</div>
          <div class="pb" style="margin-top:4px"><div class="pf ${cls}" style="width:${p1}%"></div></div>
          <div class="m" style="margin-top:2px">${p1}% · ${nec>0?'Falta: '+fmt(nec):'✓ Lista'}</div>
        </div>
        <div class="ms"><label>Calificadas</label>
          <div class="v">${cTot||'—'}</div><div class="m">Meta: ${cMet}</div>
          <div class="pb" style="margin-top:4px"><div class="pf go" style="width:${p2}%"></div></div>
          <div class="m" style="margin-top:2px">${p2}% · ${cNec>0?'Falta: '+cNec:'✓ Lista'}</div>
        </div>
      </div>
      <div class="cm" style="margin-top:4px">📅 ${plazo}</div>
      ${b}</div>`;
  }
  return`
    <h2 class="stitle">🌟 Programa Director Primer Año</h2>
    <div class="ibox">
      <strong>$1,000 por cada reto trimestral:</strong> <strong>$15,000</strong> producción + <strong>6 calificadas</strong> CG®.
      Ganar los 4 = $1,000 adicional + banner Fabulosos 50.
    </div>
    <div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(255px,1fr))">
      ${retoCard('1️⃣ Comienza con Fuerza – Meses 1-3',d1)}
      ${retoCard('2️⃣ Crece con Fuerza – Meses 4-6',d2)}
      ${retoCard('3️⃣ Sigue con Fuerza – Meses 7-9',d3)}
      ${retoCard('4️⃣ Dirige con Fuerza – Meses 10-12',d4)}
    </div>`;
}

// ── TAB 2: CONFERENCIA DE LIDERAZGO ──────────────────────────────
async function renderConf(code){
  const [ccData,ecData,ptData]=await Promise.all([getFile('cco'),getFile('ecf'),getFile('pts')]);
  const d=findDir(ccData.rows,code);
  const de=findDir(ecData.rows,code);
  const dp=findDir(ptData.rows,code);
  const r=d?._raw||[], ix=d?._idx||ccData.idx;
  const er=de?._raw||[], eix=de?._idx||ecData.idx;
  const persYTD=money(cv(r,ix,'Personal',0)||r[8]);
  const unidYTD=money(cv(r,ix,'Unidad',0)||r[9]);
  const calif  =num(cv(r,ix,'Calificada',0)||r[11]);
  const stars  =num(cv(er,eix,'Estrellas de Seminario a la fecha 2')||er[16]);
  const nivel  =cv(er,eix,'Nivel de Estrella personal',0)||'—';
  const puntos =num(dp?.['Total de puntos']||(dp?._raw||[])[6]);
  const M1=27500,M2=15,M3=200000;
  const ok1=persYTD>=M1,ok2=calif>=M2,ok3=unidYTD>=M3;
  const retos=[ok1,ok2,ok3].filter(Boolean).length;
  return`
    <h2 class="stitle">🏆 Conferencia de Liderazgo 2027</h2>
    <div class="ibox">
      <strong>Fiesta Velada al Atardecer:</strong> 2 de 3 retos (1 jul – 31 dic 2026):<br>
      ① $27,500 ventas personales &nbsp; ② 15 nuevas calificadas &nbsp; ③ $200,000 volumen unidad
    </div>
    <div class="rsum">
      <div style="font-size:12px;color:var(--gy)">Retos completados</div>
      <div style="font-size:36px;font-weight:700;color:var(--dk)">${retos} / 3</div>
      ${retos>=2?bdg('🎊 Entrada VIP – Velada al Atardecer','bok'):retos===1?bdg('🎉 1 de 2 retos logrados','bwn'):bdg('Sin elegibilidad aún','ber')}
    </div>
    <div class="grid">
      ${pCard('① Ventas Personales YTD',persYTD,M1,fmt,ok1?'ok':'')}
      ${pCard('② Nuevas Calificadas',calif,M2,n=>String(n),ok2?'ok':'')}
      ${pCard('③ Volumen de Unidad YTD',unidYTD,M3,fmt,ok3?'ok':'')}
    </div>
    <h2 class="stitle">⭐ Estrellas & Puntos al Paraíso</h2>
    <div class="grid">
      ${pCard('Estrellas de Unidad (Conferencia)',stars,14,n=>n+' ⭐','go')}
      ${iCard('Nivel Estrella Personal',nivel,'',nivel&&nivel!=='—'?'Estrella activa':'Sin nivel',nivel&&nivel!=='—'?'bok':'bwn')}
      ${iCard('Puntos al Paraíso',puntos?puntos.toLocaleString():'—','Top 10 → escenario',puntos>0?'En ranking':'—',puntos>0?'binfo':'bwn')}
    </div>`;
}

// ── TAB 3: AUTO PROFESIONAL ───────────────────────────────────────
async function renderAuto(code){
  const aData=await getFile('aut');
  const d=findDir(aData.rows,code);
  if(!d) return errBlk('Auto Profesional');
  const r=d._raw||[], ix=d._idx||aData.idx;
  const award  =cv(r,ix,'Award Status')||r[7]||'—';
  const tipo   =cv(r,ix,'Tipo de premio')||r[8]||'—';
  const estatus=cv(r,ix,'Estatus')||r[10]||'—';
  const recal  =cv(r,ix,'Fecha de recalificación')||r[11]||'—';
  const exceso =money(cv(r,ix,'Exceso del trimestre anterior')||r[12]);
  const meta   =money(cv(r,ix,'Meta')||r[13]);
  const nec    =money(cv(r,ix,'Total adicional necesario para de la meta')||r[14]);
  const activo =/mantenimiento|recalificaci/i.test(estatus);
  let car='—',carMeta=0,cls='';
  if(/Grand Achiever|Gran Ganadora/i.test(award)){car='🚗 Gran Ganadora';carMeta=24000;cls='wn';}
  if(/Premier Club|Club de Primera/i.test(award)){car='🚙 Club de Primera';carMeta=33000;}
  if(/Cadillac/i.test(award)){car='🏎️ Cadillac Rosado';carMeta=57000;cls='ok';}
  const prodActual=carMeta>0&&nec>0?Math.max(0,carMeta-nec):carMeta;
  return`
    <h2 class="stitle">🚗 Uso del Auto Profesional</h2>
    <div class="ibox">
      <strong>Gran Ganadora:</strong> $24,000/trim &nbsp; <strong>Club de Primera:</strong> $33,000/trim &nbsp; <strong>Cadillac:</strong> $57,000/trim
    </div>
    <div class="grid">
      ${iCard('Programa actual',car,award,activo?'Activo':'Sin programa activo',activo?'bok':'bwn')}
      ${iCard('Tipo de recompensa',tipo,'')}
      ${iCard('Estatus',estatus,'',activo?'Vigente':'—',activo?'bok':'binfo')}
      ${recal&&recal!=='—'?iCard('Próx. recalificación',recal,''):''}
    </div>
    ${carMeta>0?`
    <h2 class="stitle">📊 Progreso trimestral</h2>
    <div class="grid">
      ${pCard('Producción este trimestre',prodActual,carMeta,fmt,cls)}
      ${iCard('Faltante para meta',nec>0?fmt(nec):'✅ Completa',nec>0?'Para '+fmt(carMeta):'',nec<=0?'Sin deuda':'Pendiente',nec<=0?'bok':'ber')}
      ${exceso>0?iCard('Exceso acumulado',fmt(exceso),'Crédito trimestres anteriores','Disponible','bok'):''}
    </div>`:''}`;
}

// ── TAB 4: CORTES DE SEMINARIO ────────────────────────────────────
async function renderCortes(code){
  const csData=await getFile('csm');
  const d=findDir(csData.rows,code);
  if(!d) return errBlk('Cortes de Seminario');
  const r=d._raw||[], ix=d._idx||csData.idx;
  const persYTD=money(cv(r,ix,'Personal',0)||r[8]);
  const unidYTD=money(cv(r,ix,'Unidad',0)||r[9]);
  const calif  =num(cv(r,ix,'Calificada',0)||r[11]);
  const comis  =money(cv(r,ix,'Ganadas Comisiones',0)||r[12]);
  const M_V=45000,M_C=24,M_L=300000,M_E=650000;
  const rv=persYTD>=M_V,rc=calif>=M_C,rl=unidYTD>=M_L,re=unidYTD>=M_E;
  function cortCard(label,val,goal,fmtFn,logrado,premio){
    const p=pct(val,goal);
    return`<div class="card ${logrado?'ok':''}">
      <div class="cl">${label}</div>
      <div class="cv">${fmtFn(val)}</div>
      <div class="cm">Meta: ${fmtFn(goal)}</div>
      ${logrado?bdg(premio,'bok'):sBdg(p)}
      <div class="pw">
        <div class="pl"><span>${p}%</span><span>Falta: ${fmtFn(Math.max(0,goal-val))}</span></div>
        <div class="pb"><div class="pf ${logrado?'ok':''}" style="width:${p}%"></div></div>
      </div></div>`;
  }
  return`
    <h2 class="stitle">🎖️ Cortes de Seminario 2027</h2>
    <div class="ibox">
      <strong>Período:</strong> 1 jul 2026 – 30 jun 2027<br>
      💍 Corte Ventas $45,000 &nbsp; 🐝 Corte Compartir 24 nuevas &nbsp; 💰 Círculo Logros $300K &nbsp; ✈️ Excelencia $650K
    </div>
    <div class="grid">
      ${cortCard('Corte de Ventas Personales',persYTD,M_V,fmt,rv,'💍 Anillo Amatista o $500')}
      ${cortCard('Corte de Compartir',calif,M_C,n=>String(n),rc,'🐝 Broche Abeja o $525')}
    </div>
    <div class="grid">
      ${cortCard('Círculo de Logros',unidYTD,M_L,fmt,rl,'💰 Gratificación $1,000')}
      <div class="card ${re?'ok':'go'}">
        <div class="cl">Círculo de la Excelencia</div>
        <div class="cv">${fmt(unidYTD)}</div>
        <div class="cm">Meta: ${fmt(M_E)}</div>
        ${re?bdg('✈️ Viaje a Roma','bok'):bdg('Falta: '+fmt(M_E-unidYTD),'binfo')}
        <div class="pw">
          <div class="pl"><span>${pct(unidYTD,M_E)}%</span><span>${fmt(M_E)}</span></div>
          <div class="pb"><div class="pf go" style="width:${pct(unidYTD,M_E)}%"></div></div>
        </div>
      </div>
    </div>
    ${comis>0?`<div class="grid">${iCard('Comisiones ganadas YTD',fmt(comis),'Acumulado año Seminario','Activas','bok')}</div>`:''}`;
}

// ── ROUTING ────────────────────────────────────────────────────────
const RENDERS=[renderCom,renderPA,renderConf,renderAuto,renderCortes];
const _loaded=new Set();
let _code='';

async function showTab(idx){
  document.querySelectorAll('.tabp').forEach((el,i)=>el.classList.toggle('on',i===idx));
  document.querySelectorAll('.tbtn').forEach((el,i)=>el.classList.toggle('on',i===idx));
  if(_loaded.has(idx)) return;
  _loaded.add(idx);
  const el=document.getElementById('t'+idx);
  el.innerHTML=`<div class="terr"><div class="spinner" style="margin:auto"></div><p style="margin-top:10px;color:var(--pk)">Cargando datos...</p></div>`;
  try{el.innerHTML=await RENDERS[idx](_code);}
  catch(e){el.innerHTML=`<div class="terr">⚠️ Error: ${e.message}</div>`;}
}

async function doLogin(){
  const code=document.getElementById('ci').value.trim().toUpperCase();
  if(!code) return;
  showScreen('loading');
  _code=code;
  try{
    const data=await getFile('com');
    const dir=findDir(data.rows,code);
    if(!dir){
      const n=data.rows.length;
      document.getElementById('errmsg').textContent=
        n>0?`Código "${code}" no encontrado (${n} directoras en archivo). Verifica en InTouch®.`
           :'No se pudo conectar con los datos. Verifica las URLs de Google Sheets.';
      showScreen('error'); return;
    }
    const name=dir['Nombre']||`${dir['Primer nombre']||''} ${dir['Apellido']||''}`.trim()||code;
    const nivel=dir['Nivel profesional']||'';
    const debut=dir['Fecha de debut']||'';
    document.getElementById('dname').textContent=name;
    document.getElementById('dinfo').textContent=[nivel,debut?'Debut: '+debut:'','Código: '+code].filter(Boolean).join(' · ');
    _loaded.clear();
    for(let i=1;i<5;i++) document.getElementById('t'+i).innerHTML='';
    showScreen('dash');
    showTab(0);
  }catch(e){
    document.getElementById('errmsg').textContent='Error de conexión: '+e.message;
    showScreen('error');
  }
}
</script>
