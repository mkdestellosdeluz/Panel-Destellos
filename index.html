<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>La Llave del Éxito – Destellos de Luz</title>
<style>
:root{color-scheme:light;--pk:#DA1884;--dk:#8C0049;--lt:#FFF0F7;--go:#C9A84C;--gy:#6b7280;--ok:#16a34a;--wn:#d97706;--er:#dc2626}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#FFF5F9;color:#1a1a2e;min-height:100vh}
.screen{min-height:100vh;display:none;align-items:center;justify-content:center}
#login-screen{background:linear-gradient(135deg,#FFF0F7,#FFE0F0);display:flex}
.lcard{background:#fff;border-radius:20px;padding:44px 36px;max-width:400px;width:90%;box-shadow:0 20px 60px rgba(218,24,132,.15);text-align:center}
.lcard .lsub{font-size:11px;letter-spacing:4px;color:var(--gy);text-transform:uppercase;margin-bottom:6px}
.lcard h1{font-size:24px;color:var(--dk);font-weight:800;margin-bottom:4px}
.lcard p{color:var(--gy);font-size:13px;margin-bottom:26px;line-height:1.5}
.lcard input{width:100%;padding:14px;border:2px solid #e5e7eb;border-radius:12px;font-size:22px;text-align:center;letter-spacing:3px;text-transform:uppercase;outline:none;transition:border-color .2s;margin-bottom:12px}
.lcard input:focus{border-color:var(--pk)}
.btn{width:100%;padding:13px;background:linear-gradient(135deg,var(--pk),var(--dk));color:#fff;border:none;border-radius:12px;font-size:15px;font-weight:600;cursor:pointer;transition:opacity .2s}
.btn:hover{opacity:.9}
.hint{margin-top:10px;font-size:11px;color:var(--gy)}
.spinner{width:42px;height:42px;border:4px solid #fce7f3;border-top-color:var(--pk);border-radius:50%;animation:spin .8s linear infinite;margin:auto}
@keyframes spin{to{transform:rotate(360deg)}}
#dashboard{display:none;min-height:100vh;flex-direction:column}
.topbar{background:linear-gradient(135deg,var(--dk),var(--pk));color:#fff;padding:14px 20px;display:flex;justify-content:space-between;align-items:center}
.topbar h2{font-size:17px;font-weight:700}.topbar small{font-size:11px;opacity:.8;display:block;margin-top:2px}
.btnout{background:rgba(255,255,255,.2);border:1px solid rgba(255,255,255,.4);color:#fff;padding:6px 13px;border-radius:8px;cursor:pointer;font-size:12px}
.tabs-wrap{background:#fff;border-bottom:2px solid #f3e6ef;overflow-x:auto}
.tabs{display:flex;min-width:max-content;padding:0 12px}
.tbtn{padding:10px 10px;border:none;background:none;cursor:pointer;font-size:12px;font-weight:500;color:var(--gy);border-bottom:3px solid transparent;white-space:nowrap;transition:all .2s}
.tbtn.on{color:var(--pk);border-bottom-color:var(--pk);font-weight:600}
.tabp{display:none;padding:18px;max-width:940px;margin:0 auto}
.tabp.on{display:block}
.stitle{font-size:15px;font-weight:700;color:var(--dk);margin-bottom:11px;padding-bottom:6px;border-bottom:2px solid var(--lt)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:11px;margin-bottom:16px}
.card{background:#fff;border-radius:12px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.07);border-left:4px solid var(--pk)}
.card.go{border-left-color:var(--go)}.card.ok{border-left-color:var(--ok)}.card.wn{border-left-color:var(--wn)}.card.er{border-left-color:var(--er)}
.cl{font-size:10px;text-transform:uppercase;letter-spacing:1px;color:var(--gy);margin-bottom:4px}
.cv{font-size:22px;font-weight:700}
.cm{font-size:11px;color:var(--gy);margin-top:2px}
.bdg{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10px;font-weight:600;margin-top:6px}
.bok{background:#dcfce7;color:#15803d}.bwn{background:#fef9c3;color:#a16207}.ber{background:#fee2e2;color:#991b1b}.binfo{background:#e0f2fe;color:#0369a1}
.pw{margin-top:7px}.pl{display:flex;justify-content:space-between;font-size:10px;color:var(--gy);margin-bottom:2px}
.pb{height:7px;background:#f3e6ef;border-radius:4px;overflow:hidden}
.pf{height:100%;border-radius:4px;background:linear-gradient(90deg,var(--pk),var(--dk));transition:width .5s}
.pf.go{background:linear-gradient(90deg,var(--go),#a07830)}.pf.ok{background:linear-gradient(90deg,var(--ok),#166534)}
.ibox{background:var(--lt);border-radius:10px;padding:12px 15px;margin-bottom:13px;font-size:13px;line-height:1.7}
.rsum{background:var(--lt);border-radius:10px;padding:13px;margin-bottom:13px;text-align:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:6px 0}
.ms label{font-size:10px;color:var(--gy)}.ms .v{font-size:16px;font-weight:700}.ms .m{font-size:10px;color:var(--gy)}
.terr{padding:28px;text-align:center;color:var(--gy)}
.nota{background:#fff8e1;border:1px solid #ffe082;border-radius:8px;padding:10px 14px;font-size:11px;color:#795548;margin-bottom:12px}
</style>
</head>
<body>
<div id="login-screen" class="screen">
  <div class="lcard">
    <p class="lsub">Mary Kay · Área Destellos de Luz</p>
    <h1>🔑 La Llave del Éxito</h1>
    <p>Ingresa tu código de consultora para ver tus metas y resultados</p>
    <input id="ci" type="text" placeholder="Ej: 0000XX" maxlength="8"
      oninput="this.value=this.value.toUpperCase()"
      onkeydown="if(event.key==='Enter')doLogin()">
    <button class="btn" onclick="doLogin()">Ver mis resultados →</button>
    <p class="hint">Código visible en tu portal InTouch® de Mary Kay</p>
  </div>
</div>
<div id="error-screen" class="screen" style="flex-direction:column;text-align:center;padding:24px">
  <div style="font-size:48px">🔍</div>
  <h2 style="color:var(--dk);margin-top:10px">Código no encontrado</h2>
  <p id="errmsg" style="color:var(--gy);max-width:320px;margin-top:6px">Verifica tu código e intenta de nuevo.</p>
  <button class="btn" style="max-width:180px;margin-top:14px" onclick="goLogin()">Reintentar</button>
</div>
<div id="dashboard">
  <div class="topbar">
    <div><h2 id="dname">—</h2><small id="dinfo">—</small></div>
    <button class="btnout" onclick="goLogin()">↩ Salir</button>
  </div>
  <div class="tabs-wrap">
    <div class="tabs">
      <button class="tbtn on" onclick="showTab(0)">💰 Comis.</button>
      <button class="tbtn"    onclick="showTab(1)">🌟 1er Año</button>
      <button class="tbtn"    onclick="showTab(2)">🏆 Conf.</button>
      <button class="tbtn"    onclick="showTab(3)">🚗 Auto</button>
      <button class="tbtn"    onclick="showTab(4)">🎖️ Cortes</button>
      <button class="tbtn"    onclick="showTab(5)">🌴 Puntos</button>
      <button class="tbtn"    onclick="showTab(6)">💪 Bienestar</button>
    </div>
  </div>
  <div id="t0" class="tabp on"></div>
  <div id="t1" class="tabp"></div>
  <div id="t2" class="tabp"></div>
  <div id="t3" class="tabp"></div>
  <div id="t4" class="tabp"></div>
  <div id="t5" class="tabp"></div>
  <div id="t6" class="tabp"></div>
</div>

function pCard(label,val,goal,fmtFn,cls){

}

${pCard('Estrellas de Unidad (col J – Q1)',stars,5,n=>n+' ⭐','go')}
${iCard('Nivel Estrella Personal',nivelE,'Tu calificación estrella')}
${of>0?iCard('Directoras descendientes',of,'',of+' descendiente'+(of>1?'s':''),'binfo'):''}
</div>`;
}
function renderPA(code){
  const d=DATOS[code];if(!d) return errBlk('Primer Año');
  const cfs=d.cf||[null,null,null,null];
  const labels=['1️⃣ Comienza con Fuerza – Meses 1-3','2️⃣ Crece con Fuerza – Meses 4-6','3️⃣ Sigue con Fuerza – Meses 7-9','4️⃣ Dirige con Fuerza – Meses 10-12'];
  function retoCard(label,cf){
    if(!cf) return`<div class="card" style="opacity:.4;border-left-color:#ccc"><div class="cl">${label}</div><div class="cv" style="font-size:14px;color:var(--gy)">No inscrita</div><div class="cm">No aplica en este período</div>${bdg('Sin período activo','binfo')}</div>`;
    const tot=cf.total||0,met=cf.meta||15000,nec=Math.max(0,cf.nec||0);
    const cTot=cf.cTot||0,cMet=cf.cMet||6,cNec=Math.max(0,cf.cNec||0);
    const plazo=cf.plazo||'—',win=cf.win||false;
    const p1=pct(tot,met),p2=pct(cTot,cMet),cls=win||(p1>=100&&p2>=100)?'ok':'';
    const b=win?bdg('🏆 Ganadora – $1,000','bok'):(p1>=100&&p2>=100)?bdg('✅ Meta lograda – $1,000','bok'):(p1>=65||p2>=65)?bdg('📈 En progreso','bwn'):bdg('⚡ Necesita avanzar','ber');
    return`<div class="card ${cls}"><div class="cl">${label}</div><div class="g2"><div class="ms"><label>Producción</label><div class="v">${fmt(tot)}</div><div class="m">Meta: ${fmt(met)}</div><div class="pb" style="margin-top:4px"><div class="pf ${cls}" style="width:${p1}%"></div></div><div class="m" style="margin-top:2px">${p1}% · ${nec>0?'Falta: '+fmt(nec):'✓ Lista'}</div></div><div class="ms"><label>Calificadas</label><div class="v">${cTot||'—'}</div><div class="m">Meta: ${cMet}</div><div class="pb" style="margin-top:4px"><div class="pf go" style="width:${p2}%"></div></div><div class="m" style="margin-top:2px">${p2}% · ${cNec>0?'Falta: '+cNec:'✓ Lista'}</div></div></div><div class="cm" style="margin-top:4px">📅 ${plazo}</div>${b}</div>`;
  }
  const hayAlguno=cfs.some(c=>c!=null);
  return`<h2 class="stitle">🌟 Programa Director Primer Año</h2>
<div class="ibox"><strong>$1,000 por cada reto trimestral:</strong> <strong>$15,000</strong> producción + <strong>6 calificadas</strong> CG®.<br>Ganar los 4 = <strong>$1,000 adicional</strong> + banner Fabulosos 50.</div>
${!hayAlguno?'<div class="nota">No apareces en ningún programa activo de Primer Año este período.</div>':''}
<div class="grid" style="grid-template-columns:repeat(auto-fit,minmax(255px,1fr))">${labels.map((l,i)=>retoCard(l,cfs[i])).join('')}</div>`;
}
function renderConf(code){
  const d=DATOS[code];if(!d) return errBlk('Conferencia');
  const persYTD=d.persYTD||0,unidYTD=d.unidYTD||0,calif=d.califConf||0;
  const stars=d.estrellas||0,nivel=d.nivelEstrella||'—',puntos=d.puntos||0;
  const M1=27500,M2=15,M3=200000;
  const ok1=persYTD>=M1,ok2=calif>=M2,ok3=unidYTD>=M3;
  const retos=[ok1,ok2,ok3].filter(Boolean).length;
  return`<h2 class="stitle">🏆 Conferencia de Liderazgo 2027</h2>
<div class="ibox"><strong>Fiesta Velada al Atardecer:</strong> 2 de 3 retos (1 jul – 31 dic 2026):<br>① $27,500 ventas personales &nbsp; ② 15 nuevas calificadas &nbsp; ③ $200,000 volumen unidad</div>
<div class="rsum"><div style="font-size:12px;color:var(--gy)">Retos completados</div><div style="font-size:36px;font-weight:700;color:var(--dk)">${retos} / 3</div>${retos>=2?bdg('🎊 Entrada VIP – Velada al Atardecer','bok'):retos===1?bdg('🎉 1 de 2 retos logrados','bwn'):bdg('Sin elegibilidad aún','ber')}</div>
<div class="grid">${pCard('① Ventas Personales YTD',persYTD,M1,fmt,ok1?'ok':'')}${pCard('② Nuevas Calificadas',calif,M2,n=>String(n),ok2?'ok':'')}${pCard('③ Volumen de Unidad YTD',unidYTD,M3,fmt,ok3?'ok':'')}</div>
<h2 class="stitle">⭐ Estrellas & Puntos al Paraíso</h2>
<div class="grid">${pCard('Estrellas de Unidad',stars,14,n=>n+' ⭐','go')}${iCard('Nivel Estrella Personal',nivel,'',nivel&&nivel!=='—'?'Estrella activa':'Sin nivel',nivel&&nivel!=='—'?'bok':'bwn')}${iCard('Puntos al Paraíso',puntos?puntos.toLocaleString('es-MX'):'—','Top 10 → escenario',puntos>0?'En ranking':'—',puntos>0?'binfo':'bwn')}</div>`;
}
function renderAuto(code){
  const d=DATOS[code];if(!d) return errBlk('Auto Profesional');
  const award=d.autAward||'',tipo=d.autTipo||'',estatus=d.autEstatus||'';
  const recal=d.autRecal||'',exceso=d.autExceso||0,meta=d.autMeta||0,nec=d.autNec||0;
  const activo=/mantenimiento|recalificaci/i.test(estatus);
  let car='—',carMeta=0,cls='';
  if(/Grand Achiever/i.test(award)){car='🚗 Gran Ganadora';carMeta=24000;cls='wn';}
  if(/Premier Club/i.test(award)){car='🚙 Club de Primera';carMeta=33000;}
  if(/Cadillac/i.test(award)){car='🏎️ Cadillac Rosado';carMeta=57000;cls='ok';}
  if(/Ninguna/i.test(award)){car='Sin programa activo';carMeta=0;}
  const prodActual=carMeta>0&&nec>0?Math.max(0,carMeta-nec):carMeta;
  return`<h2 class="stitle">🚗 Uso del Auto Profesional</h2>
<div class="ibox"><strong>Gran Ganadora:</strong> $24,000/trim &nbsp; <strong>Club de Primera:</strong> $33,000/trim &nbsp; <strong>Cadillac:</strong> $57,000/trim</div>
<div class="grid">${iCard('Programa actual',car,award,activo?'Activo':'Sin programa activo',activo?'bok':'bwn')}${tipo?iCard('Tipo de recompensa',tipo,''):''}${iCard('Estatus',estatus||'—','',activo?'Vigente':'—',activo?'bok':'binfo')}${recal?iCard('Próx. recalificación',recal,''):''}</div>
${carMeta>0?`<h2 class="stitle">📊 Progreso trimestral</h2><div class="grid">${pCard('Producción este trimestre',prodActual,carMeta,fmt,cls)}${iCard('Faltante para meta',nec>0?fmt(nec):'✅ Completa',nec>0?'Para '+fmt(carMeta):'',nec<=0?'Sin deuda':'Pendiente',nec<=0?'bok':'ber')}${exceso>0?iCard('Exceso acumulado',fmt(exceso),'Crédito trimestres anteriores','Disponible','bok'):''}</div>`:''}`;
}
function renderCortes(code){
  const d=DATOS[code];if(!d) return errBlk('Cortes de Seminario');
  const persYTD=d.persYTD||0,unidYTD=d.unidYTD||0,calif=d.califConf||0,comis=d.comisConf||0;
  const M_V=45000,M_C=24,M_L=300000,M_E=650000;
  const rv=persYTD>=M_V,rc=calif>=M_C,rl=unidYTD>=M_L,re=unidYTD>=M_E;
  function cortCard(label,val,goal,fmtFn,logrado,premio){
    const p=pct(val,goal);
    return`<div class="card ${logrado?'ok':''}"><div class="cl">${label}</div><div class="cv">${fmtFn(val)}</div><div class="cm">Meta: ${fmtFn(goal)}</div>${logrado?bdg(premio,'bok'):sBdg(p)}<div class="pw"><div class="pl"><span>${p}%</span><span>Falta: ${fmtFn(Math.max(0,goal-val))}</span></div><div class="pb"><div class="pf ${logrado?'ok':''}" style="width:${p}%"></div></div></div></div>`;
  }
  return`<h2 class="stitle">🎖️ Cortes de Seminario 2027</h2>
<div class="ibox"><strong>Período:</strong> 1 jul 2026 – 30 jun 2027<br>💍 Corte Ventas $45,000 &nbsp; 🐝 Corte Compartir 24 nuevas &nbsp; 💰 Círculo Logros $300K &nbsp; ✈️ Excelencia $650K</div>
<div class="grid">${cortCard('Corte de Ventas Personales',persYTD,M_V,fmt,rv,'💍 Anillo Amatista o $500')}${cortCard('Corte de Compartir',calif,M_C,n=>String(n),rc,'🐝 Broche Abeja o $525')}</div>
<div class="grid">${cortCard('Círculo de Logros',unidYTD,M_L,fmt,rl,'💰 Gratificación $1,000')}<div class="card ${re?'ok':'go'}"><div class="cl">Círculo de la Excelencia</div><div class="cv">${fmt(unidYTD)}</div><div class="cm">Meta: ${fmt(M_E)}</div>${re?bdg('✈️ Viaje a Roma','bok'):bdg('Falta: '+fmt(M_E-unidYTD),'binfo')}<div class="pw"><div class="pl"><span>${pct(unidYTD,M_E)}%</span><span>${fmt(M_E)}</span></div><div class="pb"><div class="pf go" style="width:${pct(unidYTD,M_E)}%"></div></div></div></div></div>
${comis>0?`<div class="grid">${iCard('Comisiones ganadas YTD',fmt(comis),'Acumulado año Seminario','Activas','bok')}</div>`:''}`;
}
const RENDERS=[renderCom,renderPA,renderConf,renderAuto,renderCortes,renderPuntos,renderBienestar];
const _loaded=new Set();let _code='';
function showTab(idx){
  document.querySelectorAll('.tabp').forEach((el,i)=>el.classList.toggle('on',i===idx));
  document.querySelectorAll('.tbtn').forEach((el,i)=>el.classList.toggle('on',i===idx));
  if(_loaded.has(idx)) return;_loaded.add(idx);
  const el=document.getElementById('t'+idx);
  try{el.innerHTML=RENDERS[idx](_code);}
  catch(e){el.innerHTML=`<div class="terr">⚠️ Error: ${e.message}</div>`;}
}
function doLogin(){
  const code=document.getElementById('ci').value.trim().toUpperCase();
  if(!code) return;
  const d=DATOS[code];
  if(!d){document.getElementById('errmsg').textContent=`Código "${code}" no encontrado (${Object.keys(DATOS).length} directoras). Verifica en InTouch®.`;showScreen('error');return;}
  document.getElementById('dname').textContent=d.nombre;
  document.getElementById('dinfo').textContent=[d.nivel,d.debut?'Debut: '+d.debut:'','Código: '+code].filter(Boolean).join(' · ');
  _code=code;_loaded.clear();
  for(let i=1;i<6;i++) document.getElementById('t'+i).innerHTML='';
  showScreen('dash');showTab(0);
}

function renderPuntos(code){
  const d=DATOS[code];if(!d) return errBlk('Puntos al Paraíso');
  const cons=d.puntosCons||[];
  const niveles=[
    {pts:25000,label:'Nivel 1',premio:'Gafas de sol Gucci',icon:'🕶️'},
    {pts:50000,label:'Nivel 2',premio:'+ Bolso Ferragamo',icon:'👜'},
    {pts:75000,label:'Nivel 3',premio:'+ Crucero Royal Caribbean $2,000',icon:'🛳️'},
  ];
  const ganaron=cons.filter(c=>c.total>=25000);
  const enCamino=cons.filter(c=>c.total>0&&c.total<25000);
  const sinPuntos=cons.filter(c=>c.total===0);
  const totalUnidad=cons.reduce((s,c)=>s+c.total,0);

  function pBar(pts){
    const pct=Math.min(100,Math.round(pts/25000*100));
    const col=pts>=75000?'#C9A84C':pts>=50000?'#9B59B6':pts>=25000?'#27AE60':'#DA1884';
    return `<div style="background:#f0d0e8;border-radius:4px;height:8px;margin:4px 0 2px">
      <div style="width:${pct}%;background:${col};height:8px;border-radius:4px"></div></div>
      <div style="font-size:10px;color:#888">${pct}% de 25,000</div>`;
  }
  function nivelIcon(pts){return pts>=75000?'🥇':pts>=50000?'🥈':pts>=25000?'🥉':'';}
  function consRow(c){
    return `<div style="background:#fff;border:1px solid #f0d0e8;border-radius:8px;padding:10px 12px;margin-bottom:8px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <div><span style="font-weight:600;font-size:13px">${nivelIcon(c.total)} ${c.nombre}</span>
          <span style="font-size:11px;color:#888;margin-left:8px">${c.nivel} · ${c.status}</span></div>
        <div style="font-weight:700;color:var(--pk);font-size:14px">${c.total.toLocaleString()} pts</div>
      </div>
      ${pBar(c.total)}
      <div style="font-size:11px;color:#999;margin-top:4px">Personal: $${c.vol_personal.toLocaleString()} · Equipo: $${c.vol_equipo.toLocaleString()}${c.puntos_pot>0?' · Potenciador: '+c.puntos_pot:''}</div>
    </div>`;
  }

  const levCards=niveles.map(n=>`<div style="flex:1;min-width:130px;background:linear-gradient(135deg,#fff0f7,#ffe0f0);border:2px solid var(--pk);border-radius:10px;padding:12px;text-align:center">
    <div style="font-size:22px">${n.icon}</div>
    <div style="font-weight:700;color:var(--dk)">${n.label}</div>
    <div style="font-size:11px;color:#555;margin-top:4px">${n.premio}</div>
    <div style="font-weight:700;color:var(--pk);margin-top:6px">${n.pts.toLocaleString()} pts</div>
  </div>`).join('');

  let rows='';
  if(ganaron.length){
    rows+=`<h4 style="color:#27AE60;margin:0 0 8px">🏆 Ya ganaron (${ganaron.length})</h4>`;
    ganaron.forEach(c=>{rows+=consRow(c);});
  }
  if(enCamino.length){
    rows+=`<h4 style="color:var(--pk);margin:16px 0 8px">🌟 En camino al Paraíso (${enCamino.length})</h4>`;
    enCamino.forEach(c=>{rows+=consRow(c);});
  }
  if(sinPuntos.length){
    rows+=`<h4 style="color:#bbb;margin:16px 0 8px">⏳ Sin puntos aún (${sinPuntos.length})</h4>`;
    sinPuntos.slice(0,5).forEach(c=>{rows+=consRow(c);});
    if(sinPuntos.length>5) rows+=`<div style="text-align:center;color:#bbb;font-size:12px;padding:8px">...y ${sinPuntos.length-5} más</div>`;
  }

  return `<div style="padding:4px 0">
    <h3 style="color:var(--dk);margin:0 0 12px">🌴 Puntos al Paraíso — Mayo 1 – Oct 31, 2026</h3>
    <div style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap">${levCards}</div>
    <div style="background:linear-gradient(135deg,var(--dk),var(--pk));color:#fff;border-radius:10px;padding:14px 18px;margin-bottom:16px;display:flex;gap:20px;flex-wrap:wrap">
      <div><div style="font-size:22px;font-weight:700">${cons.length}</div><div style="font-size:12px;opacity:.85">Consultoras</div></div>
      <div><div style="font-size:22px;font-weight:700">${totalUnidad.toLocaleString()}</div><div style="font-size:12px;opacity:.85">Puntos Unidad</div></div>
      <div><div style="font-size:22px;font-weight:700">${ganaron.length}</div><div style="font-size:12px;opacity:.85">Ya ganaron 🏆</div></div>
      <div><div style="font-size:22px;font-weight:700">${enCamino.length}</div><div style="font-size:12px;opacity:.85">En camino 🌟</div></div>
    </div>
    ${rows}
  </div>`;
}

function renderBienestar(code){
  const d=DATOS[code];if(!d) return errBlk('Bienestar Físico');
  const b=d.bienestar;
  if(!b) return '<div class="terr">ℹ️ Sin datos de Bienestar Físico para esta directora.</div>';
  const prod=b.prod||0,m1=b.meta800||60000,m2=b.meta1300||125000,m3=b.meta2000||187000;
  const nec800=b.nec800||0,nec1300=b.nec1300||0,nec2000=b.nec2000||0;
  const w1=Math.min(100,Math.round(prod/m1*100));
  const w2=Math.min(100,Math.round(prod/m2*100));
  const w3=Math.min(100,Math.round(prod/m3*100));
  const ok1=nec800<=0,ok2=nec1300<=0,ok3=nec2000<=0;
  function bCard(label,bono,meta,nec,pct,logrado){
    const cls=logrado?'ok':pct>=50?'wn':'go';
    const bar='<div class="pw"><div class="pl"><span>'+pct+'%</span><span>'+fmt(meta)+'</span></div><div class="pb"><div class="pf '+cls+'" style="width:'+pct+'%"></div></div></div>';
    const status=logrado?bdg('🏆 ¡Bono Ganado!','bok'):bdg('Falta: '+fmt(nec),'b'+cls);
    return '<div class="card '+cls+'"><div class="cl">'+label+'</div>'
      +'<div class="cv" style="font-size:1.6rem;font-weight:700;color:var(--gn)">$'+bono.toLocaleString('en-US')+'</div>'
      +'<div class="cm">Meta: '+fmt(meta)+' al mayoreo</div>'
      +bar+status+'</div>';
  }
  return '<h2 class="stitle">💪 Gratificación Bienestar Físico</h2>'
    +'<p style="color:var(--gy);font-size:.85rem;margin:0 0 12px">Producción al mayoreo de unidad – año calendario 2026</p>'
    +'<div class="card" style="margin-bottom:14px"><div class="cl">📦 Producción al Mayoreo YTD 2026</div><div class="cv">'+fmt(prod)+'</div></div>'
    +'<div class="grid">'
    +bCard('🥉 Bono $800',800,m1,nec800,w1,ok1)
    +bCard('🥈 Bono $1,300',1300,m2,nec1300,w2,ok2)
    +bCard('🥇 Bono $2,000',2000,m3,nec2000,w3,ok3)
    +'</div>';
}
